changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 缺陷修复
      labels:
        - bug
        - fix
    - title: 文档与维护
      labels:
        - documentation
        - dependencies
        - maintenance
    - title: 其他变更
      labels:
        - "*"
