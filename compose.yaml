services:
  classorbit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        ALPINE_MIRROR: "${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}"
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      TEACHER_USERNAME: "${TEACHER_USERNAME:-}"
      TEACHER_PASSWORD: "${TEACHER_PASSWORD:-}"
      CLASS_SYSTEM_TOKEN: "${CLASS_SYSTEM_TOKEN:-}"
      AUTO_BACKUP_ENABLED: "${AUTO_BACKUP_ENABLED:-true}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
    volumes:
      - classorbit_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  classorbit_data:
    name: "${DATA_VOLUME_NAME:-classorbit_data}"
